{% extends "base.html" %}
{% block title %}{{ 'Edit' if spicy else 'New' }} Spicy Level — Thai Diner Admin{% endblock %}
{% block content %}
<main>
  <div class="page-header">
    <h1 class="page-title">{{ 'Edit' if spicy else 'New' }} <span>Spicy Level</span></h1>
    <a href="{{ url_for('admin_spicy_list') }}" class="btn btn-outline">← Back</a>
  </div>
  <div class="card" style="max-width:420px">
    <form method="POST">
      <div class="form-group">
        <label>Label *</label>
        <input type="text" name="label" class="form-control"
               value="{{ spicy.label if spicy else '' }}" required placeholder="e.g. Medium">
      </div>
      <div class="form-group">
        <label>Level (number) *</label>
        <input type="number" name="level" class="form-control" min="0"
               value="{{ spicy.level if spicy else '' }}" required placeholder="0 = no spice, 4 = extra hot">
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer">
          <input type="checkbox" name="is_default"
                 {{ 'checked' if spicy and spicy.is_default else '' }}>
          Set as default
        </label>
      </div>
      <div style="display:flex;gap:0.75rem">
        <button type="submit" class="btn btn-gold">{{ 'Save' if spicy else 'Add' }}</button>
        <a href="{{ url_for('admin_spicy_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
