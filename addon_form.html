{% extends "base.html" %}
{% block title %}{{ 'Edit' if addon else 'New' }} Add-On — Thai Diner Admin{% endblock %}
{% block content %}
<main>
  <div class="page-header">
    <h1 class="page-title">{{ 'Edit' if addon else 'New' }} <span>Add-On</span></h1>
    <a href="{{ url_for('admin_addon_list') }}" class="btn btn-outline">← Back</a>
  </div>
  <div class="card" style="max-width:420px">
    <form method="POST">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" class="form-control"
               value="{{ addon.name if addon else '' }}" required placeholder="e.g. Extra Egg">
      </div>
      <div class="form-group">
        <label>Price ($) *</label>
        <input type="number" name="price" class="form-control" step="0.01" min="0"
               value="{{ addon.price if addon else '' }}" required placeholder="0.00">
      </div>
      <div style="display:flex;gap:0.75rem">
        <button type="submit" class="btn btn-gold">{{ 'Save' if addon else 'Add' }}</button>
        <a href="{{ url_for('admin_addon_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
